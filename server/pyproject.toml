[project]
name = "r1cord-server"
version = "0.3.4"
description = "Desktop offload server for the R1CORD recorder: upload, faster-whisper transcription, agent-written AI reviews, themed static pages."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "tomli-w>=1.0",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.1",
  "markdown-it-py[linkify]>=3",
  "mdit-py-plugins>=0.4",
  "pystray>=0.19; sys_platform == 'win32'",
  "Pillow>=10",
]

[project.optional-dependencies]
# NVIDIA runtime for CUDA transcription (~2 GB). CPU int8 is the default; install with `install.bat --gpu`.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
# httpx: FastAPI's TestClient.
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["r1cord_server*"]
