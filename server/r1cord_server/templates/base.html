<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block refresh %}{% if refresh %}<meta http-equiv="refresh" content="5">{% endif %}{% endblock %}
  <title>{% block title %}R1CORD Server{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="icon" type="image/png" href="/static/favicon-64.png">
</head>
<body>
  {% set path = request.url.path %}
  <header class="top">
    <a class="brand" href="/admin" aria-label="R1CORD Server — recordings">
      <img class="brand-mark" src="/static/r1cord-logomark.svg" alt="">
      <img class="brand-type" src="/static/r1cord-logotype.svg" alt="R1CORD">
      <span class="brand-tag">Server</span>
    </a>
    <nav>
      <a href="/admin" {% if path == "/admin" or path.startswith("/admin/jobs") or path.startswith("/admin/recordings") or path == "/admin/import" %}class="active"{% endif %}>Recordings</a>
      <a href="/admin/devices" {% if path.startswith("/admin/devices") or path == "/admin/pair" %}class="active"{% endif %}>Devices</a>
      <a href="/admin/config" {% if path == "/admin/config" or path == "/admin/republish" %}class="active"{% endif %}>Settings</a>
      <a href="/admin/system" {% if path == "/admin/system" %}class="active"{% endif %}>System</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <script>
  // Forms marked data-busy: the pressed button shows a spinner and "Working…" until the next page
  // loads, and further clicks are ignored. Disabling waits a tick so the pressed button's own
  // name/value is still submitted.
  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!form.matches("form[data-busy]")) return;
    const button = event.submitter || form.querySelector("button[type=submit], button:not([type])");
    setTimeout(() => {
      form.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      if (button) {
        button.classList.add("is-busy");
        button.innerHTML = '<span class="spinner" aria-hidden="true"></span> Working…';
      }
    }, 0);
  });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
